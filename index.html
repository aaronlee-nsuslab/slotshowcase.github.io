<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slot Showcase</title>
<style>
:root{--bg:#0b0d1e;--card:#161a33;--line:#2a3058;--text:#eef0ff;--muted:#9aa0c8;--accent:#ffb347}
@media (prefers-color-scheme: light){:root{--bg:#f4f5fb;--card:#fff;--line:#dde0ef;--text:#171a2e;--muted:#5d6386;--accent:#d9731c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
header{max-width:1200px;margin:0 auto;padding:28px 16px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
h1{margin:0;font-size:28px;letter-spacing:.3px}
.sub{color:var(--muted);font-size:13px}
input{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;min-width:220px}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
a.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);border-color:var(--accent);outline:none}
.thumb{aspect-ratio:16/9;background:#1d2244 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#fff;text-align:center;padding:10px}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.title{font-weight:700;font-size:16px}
.tagline{color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:60px 0}
</style>
</head>
<body>
<header>
  <div><h1>Slot Showcase</h1><div class="sub" id="count">불러오는 중…</div></div>
  <input id="q" type="search" placeholder="게임 검색(Search)" aria-label="게임 검색">
</header>
<main id="grid"></main>
<script>
(async () => {
  const grid = document.getElementById('grid');
  const count = document.getElementById('count');
  const q = document.getElementById('q');
  let games = [];
  try {
    const r = await fetch('./games.json', { cache: 'no-cache' });
    games = (await r.json()).games || [];
  } catch (e) {
    count.textContent = '게임 목록을 불러오지 못했습니다';
    return;
  }
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; };
  const draw = () => {
    const k = q.value.trim().toLowerCase();
    const list = games.filter((g) => !k || (g.title + ' ' + (g.tagline || '') + ' ' + (g.tags || []).join(' ')).toLowerCase().includes(k));
    grid.replaceChildren();
    count.textContent = games.length + '개 게임 · 카드를 누르면 바로 플레이합니다';
    if (!list.length) grid.append(el('div', 'empty', '맞는 게임이 없습니다'));
    for (const g of list) {
      const a = el('a', 'card');
      a.href = './' + encodeURIComponent(g.slug) + '/';
      const t = el('div', 'thumb', g.thumb ? '' : g.title);
      if (g.thumb) t.style.backgroundImage = 'url("./' + g.thumb.split('/').map(encodeURIComponent).join('/') + '?r=' + g.revision + '")';
      const b = el('div', 'body');
      b.append(el('div', 'title', g.title));
      if (g.tagline) b.append(el('div', 'tagline', g.tagline));
      const tags = el('div', 'tags');
      for (const x of g.tags || []) tags.append(el('span', 'tag', x));
      b.append(tags);
      a.append(t, b);
      grid.append(a);
    }
  };
  q.addEventListener('input', draw);
  draw();
})();
</script>
</body>
</html>
